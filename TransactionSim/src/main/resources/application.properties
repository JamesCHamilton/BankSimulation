spring.application.name=TransactionSim
server.port=8085

# Default profile uses H2 database for testing and fallback
spring.datasource.url=jdbc:h2:mem:bank_sim_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keep open-in-view warning quiet
spring.jpa.open-in-view=false

# Disable Redis repositories auto-wiring unless specifically needed
spring.data.redis.repositories.enabled=false
